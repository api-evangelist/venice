name: Venice
description: 'Venice is an enterprise privileged access management (PAM) platform built
  for the AI era, delivering zero standing access across human, machine, and AI-driven
  identities. Founded by Rotem Lurie (CEO) and Or Vaknin (CTO) and operating out of Tel
  Aviv and New York, Venice discovers and controls privileged access across the enterprise
  and removes standing privileges entirely, so that only the right identities reach
  critical systems and only for the moments they should. The company emerged from stealth
  in February 2026 with $33M in funding led by IVP with participation from Index Ventures.
  As an early-stage security vendor it publishes a marketing site, blog, and a public
  trust center, but does not yet expose a public developer API surface.'
